<!-- Animazione 3D dello zoledronato, aperta dalla scheda del farmaco (app.js, vFarmaco). Pagina autonoma: usa three.js r128 da cdnjs, quindi serve la connessione. -->
<title>Inibizione della FPPS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: scena 3D cartoon a tutto schermo; titolo in alto, didascalia + comandi in basso come un lettore video.
   Scelta deliberata di un solo aspetto chiaro (azzurro a sinistra, pesca a destra, come lo schema originale). */
:root{
  --bg:#eef4fb;
  --ink:#1e2747;
  --muted:#55617f;
  --paper:#ffffff;
  --via1:#3d8bff;
  --via1-soft:#d6e8ff;
  --via2:#ff5a4a;
  --via2-soft:#ffe0d8;
  --gold:#ffc531;
  --ok:#2fb866;
  --warn:#ff8a2a;
  --f-display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f-body);-webkit-font-smoothing:antialiased}
#bgwash{position:fixed;inset:0;background:
  radial-gradient(circle at 1px 1px, rgba(30,39,71,.07) 1.2px, transparent 1.6px) 0 0/22px 22px,
  linear-gradient(90deg,#cfe5ff 0%,#e4effc 45%,#fbe9df 55%,#ffd9c6 100%)}
#heat{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(50% 55% at 75% 50%, rgba(255,110,40,.45), transparent 70%)}
#stage{position:fixed;inset:0;touch-action:none;cursor:grab}
#stage:active{cursor:grabbing}
#stage canvas{display:block;width:100%;height:100%}

.top{position:fixed;left:0;right:0;top:0;padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.top h1{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,3.2vw,32px);line-height:1;margin:0;text-wrap:balance;color:var(--ink)}
.top h1 span{display:block;font-size:.55em;font-weight:500;color:var(--muted);margin-top:6px}
.sides{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.side{font:800 11px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:7px 10px;border-radius:999px;border:2px solid var(--ink);background:var(--paper);color:var(--muted);opacity:.55;transition:opacity .4s,background .4s,color .4s}
.side.v1.on{opacity:1;background:var(--via1);color:#fff}
.side.v2.on{opacity:1;background:var(--via2);color:#fff}

#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;font:800 12.5px/1.2 var(--f-body);padding:5px 10px;border-radius:10px;background:var(--paper);border:2px solid var(--ink);box-shadow:2px 3px 0 var(--ink);color:var(--ink);opacity:0;transition:opacity .6s;will-change:transform}
.lbl.on{opacity:1}
.lbl small{display:block;font-weight:700;color:var(--muted);font-size:11px}
.lbl.gold{background:#fff3c9}
.lbl.v1{background:var(--via1-soft)}
.lbl.v2{background:var(--via2-soft)}
.lbl.ok{background:#d5f5e0}
.lbl.warn{background:#ffe3c9}
.lbl.res{font-family:var(--f-display);font-weight:600;font-size:16px;padding:8px 12px}

.panel{position:fixed;left:0;right:0;bottom:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);pointer-events:none}
.card{pointer-events:auto;max-width:780px;margin:0 auto;background:rgba(255,255,255,.94);border:2.5px solid var(--ink);box-shadow:4px 5px 0 var(--ink);border-radius:18px;padding:14px 16px 12px;display:grid;gap:10px}
.meta{display:flex;align-items:center;gap:10px;font:800 11px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tag{padding:5px 9px;border-radius:999px;background:var(--gold);color:var(--ink);border:2px solid var(--ink)}
.tag.v1{background:var(--via1);color:#fff}
.tag.v2{background:var(--via2);color:#fff}
.count{margin-left:auto;font-variant-numeric:tabular-nums}
.txt{transition:opacity .35s}
.txt.fade{opacity:0}
.txt h2{font-family:var(--f-display);font-weight:600;font-size:clamp(22px,3vw,28px);line-height:1.1;margin:0 0 6px;text-wrap:balance}
.txt p{margin:0;font-size:15px;line-height:1.5;color:#2c3656;max-width:68ch}
.txt p b{color:var(--ink);font-weight:800}
.ctrl{display:flex;align-items:center;gap:8px}
.btn{appearance:none;border:2px solid var(--ink);background:var(--paper);color:var(--ink);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none;box-shadow:2px 2px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.btn:focus-visible,.seg:focus-visible{outline:3px solid var(--via1);outline-offset:2px}
.btn.play{width:46px;height:46px;background:var(--gold)}
.btn svg{width:18px;height:18px;fill:currentColor}
.tl{flex:1;display:flex;gap:4px;min-width:0}
.seg{appearance:none;border:0;padding:8px 0;background:none;flex:1;cursor:pointer;min-width:0}
.seg i{display:block;height:7px;border-radius:4px;background:#e3e7ef;border:1.5px solid var(--ink);overflow:hidden;position:relative}
.seg i b{position:absolute;inset:0;width:0;background:var(--gold)}
.seg.done i b{width:100%}
.seg.v1 i{background:var(--via1-soft)}
.seg.v2 i{background:var(--via2-soft)}
.hint{font-size:11.5px;font-weight:700;color:var(--muted);text-align:center}
.no3d .hint{display:none}
#fallback{position:fixed;inset:30% 16px auto;text-align:center;color:var(--muted);font-size:14px}
@media (max-width:560px){
  .txt p{font-size:14px}
  .side{font-size:10px;padding:5px 8px}
  .lbl{font-size:11px}
  .lbl small{font-size:10px}
  .hint{display:none}
  .card{padding:12px 12px 10px;gap:8px}
  .txt h2{font-size:21px}
}

/* stile illustrazione medica: fondo scuro, interfaccia in vetro */
:root{color-scheme:dark}
body{background:#070d18;color:#e9eef8}
#bgwash{background:radial-gradient(60% 55% at 22% 55%,rgba(70,110,200,.28),transparent 70%),radial-gradient(55% 55% at 80% 50%,rgba(200,90,70,.18),transparent 70%),radial-gradient(120% 90% at 50% 40%,#0d1a30,#05080f)}

.top h1{color:#fff}.top h1 span{color:#9fb0cc}
.side{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);color:#c8d3e6;box-shadow:none}

.lbl small{color:#9fb0cc}
.lbl.gold,.lbl.v1,.lbl.v2,.lbl.ok,.lbl.warn{background:rgba(8,14,26,.72)}
.lbl.gold{border-color:#ffc531}.lbl.v1{border-color:#5f9dff}.lbl.v2{border-color:#ff6f5f}.lbl.ok{border-color:#3fd07a}.lbl.warn{border-color:#ff9a3a}
.card{background:rgba(10,18,32,.78);border:1px solid rgba(160,190,235,.22);box-shadow:0 20px 50px rgba(0,0,0,.45);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.txt p{color:#cfd9ea}.txt p b{color:#fff}.txt h2{color:#fff}.meta,.hint{color:#8fa0bd}
.tag{border:0}
.btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#fff;box-shadow:none}
.btn.play{background:#ffc531;color:#1b1405;border-color:#ffc531}
.seg i{border:0;background:rgba(255,255,255,.14)}
@media (prefers-reduced-motion:reduce){.txt,.lbl{transition:none}}
.top .back{pointer-events:auto;display:inline-block;margin-bottom:10px;font:700 13px/1 var(--f-body);color:#fff;text-decoration:none;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22)}
.top .back:focus-visible{outline:3px solid #5f9dff;outline-offset:2px}
.top > :first-child{display:flex;flex-direction:column;align-items:flex-start}
</style>

<script>

 hmg:{t:"HMG-CoA",p:()=>P_H.clone().add(V(0,.34,0))},
 mev:{t:"Mevalonato",p:()=>P_M.clone().add(V(0,.34,0))},
 ipp:{t:"IPP<small>isopentenil pirofosfato</small>",c:"v2",p:()=>P_I.clone().add(V(.15,.4,0))},
 fppggpp:{t:"FPP · GGPP",c:"ok",p:()=>curveB.getPointAt(.45).add(V(0,.3,0))},
 oc:{t:"Osteoclasta",c:"v1",p:()=>OC.clone().add(V(0,BONE_TOP+(FING+BOTH+TOPH)*ocScale+.35,0))},
 tc:{t:"Linfocita T γδ<small>Vγ9Vδ2</small>",c:"v2",p:()=>TC.clone().add(V(0,2.25,0))},
 gtp:{t:"GTPasi ancorate<small>Ras · Rho · Rac</small>",c:"v1",p:()=>oc.localToWorld(gtps[1].g.position.clone()).add(V(0,-.25,0))},
 prenyl:{t:"Catena prenilica",c:"ok",p:()=>oc.localToWorld(gtps[2].anchor.clone().multiplyScalar(1.12))},
 gtpfree:{t:"GTPasi non prenilate<small>Cys–SH, nel citoplasma</small>",c:"v1",p:()=>oc.localToWorld(gtps[1].g.position.clone()).add(V(0,.2,0))},
 mol:{t:"Bifosfonato azotato<small>es. zoledronato</small>",c:"v2",p:()=>mol.position.clone().add(V(0,.55,0))},
 stop:{t:"Blocco",c:"v2",p:()=>FP.clone().add(V(1.15,.3,0))},
 ippacc:{t:"Accumulo di IPP",c:"v2",p:()=>P_I.clone().add(V(0,.95,0))},
 actin:{t:"Anello di actina",c:"v1",p:()=>oc.localToWorld(V(2.0,actin.position.y,0))},
 ves:{t:"Vescicole",c:"v1",p:()=>oc.localToWorld(V(-.6,.1,1.1))},
 pit:{t:"Lacuna di riassorbimento<small>di Howship</small>",p:()=>V(-3.3,BONE_TOP+.05,1.5)},
 bone:{t:"Superficie ossea",p:()=>V(-8.6,BOT-.15,3)},
 bodies:{t:"Corpi apoptotici",c:"v1",p:()=>bodies[2].m.position.clone().add(V(0,bodies[2].rb+.45,0))},
 res1:{t:"Riduzione del riassorbimento osseo<small>effetto terapeutico</small>",c:"ok res",p:()=>V(-5,1.0,0)},
 tcr:{t:"TCR",c:"v2",p:()=>tc.localToWorld(tcrs[3].position.clone().multiplyScalar(1.3))},
 cyto:{t:"Citochine<small>IFN-γ · TNF-α · IL-6</small>",c:"v2",p:()=>TC.clone().add(V(2.3,-2.4,0))},
 symp:{t:"Febbre · mialgie · malessere · astenia",c:"warn",p:()=>TC.clone().add(V(0,-4.9,0))},
 res2:{t:"Sintomi transitori di fase acuta<small>effetto collaterale</small>",c:"warn res",p:()=>TC.clone().add(V(0,2.3,0))},
 dex:{t:"Desametasone<small>↓ IL-1 · IL-6 · TNF-α · IFN-γ</small>",c:"ok",p:()=>dex.position.clone().add(V(.6,.7,0))}
};
const layer=$("labels");
for(const k in LBL){const d=document.createElement("div");d.className="lbl "+(LBL[k].c||"");d.innerHTML=LBL[k].t;layer.appendChild(d);LBL[k].el=d}

/* ---------------- Stato animato ---------------- */
const S=Object.assign({},ZERO);
let ocScale=1;
const camPos=V(...STEPS[0].cam),camLook=V(...STEPS[0].look);
let uYaw=0,uPitch=0,drag=null;
stage.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY};stage.setPointerCapture(e.pointerId)});
stage.addEventListener("pointermove",e=>{if(!drag)return;uYaw-=(e.clientX-drag.x)*.006;uPitch=Math.max(-.7,Math.min(.7,uPitch+(e.clientY-drag.y)*.004));drag={x:e.clientX,y:e.clientY}});
const endDrag=()=>{drag=null};stage.addEventListener("pointerup",endDrag);stage.addEventListener("pointercancel",endDrag);

let W=0,H=0,yOff=0;
function resize(){
  W=innerWidth;H=innerHeight;renderer.setSize(W,H,false);
  const ph=document.querySelector(".card").getBoundingClientRect().height+16;
  const th=document.querySelector(".top").getBoundingClientRect().height;
  yOff=Math.max(0,(ph-th)/2);
  camera.aspect=W/H;camera.setViewOffset(W,H,0,yOff,W,H);camera.updateProjectionMatrix();
}
addEventListener("resize",resize);resize();
window.__onStep=()=>setTimeout(resize,300);

const tmp=V(0,0,0),sp=new THREE.Spherical(),tv=V(0,0,0);
let last=performance.now(),time=0;
const ease=(cur,tg,rate,dt)=>cur+(tg-cur)*(1-Math.exp(-rate*dt));

function frame(now){
  const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;time+=dt;
  tickTimeline(dt);
  const tg=TARGETS[step];
  for(const k in S)S[k]=ease(S[k],tg[k],k==="apop"?.75:k==="mol"?1.3:1.6,dt);

  const cs=STEPS[step];
  camPos.set(ease(camPos.x,cs.cam[0],1.1,dt),ease(camPos.y,cs.cam[1],1.1,dt),ease(camPos.z,cs.cam[2],1.1,dt));
  camLook.set(ease(camLook.x,cs.look[0],1.1,dt),ease(camLook.y,cs.look[1],1.1,dt),ease(camLook.z,cs.look[2],1.1,dt));
  if(!drag){uYaw=ease(uYaw,0,.35,dt);uPitch=ease(uPitch,0,.35,dt)}
  const asp=W/H,k=Math.min(2.4,Math.max(1.12,1.12*Math.pow(1.5/asp,.8)));
  scene.fog.near=26*k;scene.fog.far=60*k;
  tmp.subVectors(camPos,camLook).multiplyScalar(k);
  sp.setFromVector3(tmp);sp.theta+=uYaw+(reduce?0:Math.sin(time*.18)*.05);sp.phi=Math.max(.25,Math.min(2.6,sp.phi-uPitch));
  tmp.setFromSpherical(sp);camera.position.copy(camLook).add(tmp);camera.lookAt(camLook);

  // osteoclasta: prima si gonfia di bolle, poi si divide in palline
  const pre=smooth(S.apop/.35), split=smooth((S.apop-.3)/.7);
  ocScale=1-.97*split;
  oc.visible=ocScale>.05;
  oc.scale.setScalar(ocScale);oc.position.set(OC.x,BONE_TOP+(FING+BOTH)*ocScale,0);
  if(oc.visible){
    const pa=ocGeo.attributes.position.array,ruff=(1-S.func)*(1-pre);
    for(let i=0;i<pa.length;i+=3){
      const x=ocBase[i],y=ocBase[i+1],z=ocBase[i+2];
      let n=1+.04*Math.sin(x*1.6+time*.8)*Math.cos(z*1.3+time*.6)+.025*Math.sin(y*2.2-time*.9);
      if(y<-R*.55)n+=.05*ruff*Math.sin(x*7+time*3)*Math.cos(z*7+time*2.4);
      n+=pre*.16*Math.max(0,Math.sin(x*2.4+time*1.5)*Math.sin(z*2.1-time*1.1)*Math.sin(y*2.8+1.3));
      pa[i]=x*n;pa[i+1]=y*n;pa[i+2]=z*n;
    }
    ocGeo.attributes.position.needsUpdate=true;ocGeo.computeVertexNormals();
  }
  ocMat.uniforms.uCol.value.copy(OC_COL).lerp(OC_DYING,pre);
  nuclei.forEach(n=>{const c=1-.45*pre;n.scale.set(.42*c,.13+.15*pre,.3*c);n.position.copy(n.userData.p).multiplyScalar(1-.4*pre)});
  ocMat.uniforms.uOp.value=1.7-.9*S.xray;
  fingers.forEach(f=>{const L=f.L*(1-.45*S.func)*(1+.05*Math.sin(time*2.2+f.ph)*(1-S.func));f.c.scale.y=L;f.c.position.y=-L/2;f.t.position.y=-L});
  bodies.forEach((b,i)=>{
    const grow=smooth((S.apop-b.delay)/.4), go=smooth((S.apop-.3-b.delay)/.6);
    b.m.visible=grow>.01;
    if(!b.m.visible)return;
    tv.set(b.dir.x*R*ocScale,b.dir.y*TOPH*ocScale,b.dir.z*R*ocScale).add(oc.position);
    b.m.position.copy(tv).lerp(b.fin,go);
    b.m.position.y+=Math.sin(go*Math.PI)*1.1;
    const wob=1+.06*Math.sin(time*2.5+b.ph);
    b.m.scale.setScalar(Math.max(.001,b.rb*grow*(.55+.45*go)*wob));
  });
  gtps.forEach(o=>{
    const p=S.prenyl;
    const free=o.free.clone().add(V(Math.sin(time*.7+o.ph)*.2,Math.cos(time*.5+o.ph)*.15,Math.cos(time*.6+o.ph)*.2));
    o.g.position.copy(o.anchor).lerp(free,p);
    o.tail.scale.setScalar(Math.max(.001,1-p));
    if(p>.05)o.g.rotation.z+=dt*.4*p;
  });
  const fl=S.func;
  actinMat.opacity=1-.85*fl;actin.scale.setScalar(1.28+.25*fl);actin.rotation.z=time*.05;
  actin.visible=actinMat.opacity>.02;
  filMat.opacity=.7*(1-.8*fl);fils.rotation.y=fl*.6;fils.scale.setScalar(1+.25*fl);
  ves.forEach(v=>{
    if(fl<.5){v.stuck=null;const u=(v.ph+time*.22)%1;v.m.position.set(v.x*(1-u*.2),.5-u*(.5+BOTH-.2),v.z*(1-u*.2));v.m.scale.setScalar(u>.92?(1-u)*12.5:1)}
    else{if(!v.stuck)v.stuck=v.m.position.clone();v.m.position.copy(v.stuck).add(V(Math.sin(time+v.ph*9)*.08,Math.cos(time*.8+v.ph*7)*.06,0));v.m.scale.setScalar(1)}
  });
  shapeBone(.32*(1-.45*S.apop));
  const crumbRate=(1-S.func*.85)*(1-S.apop);
  crumbs.forEach(c=>{const u=(c.ph+time*.25)%1;c.c.position.set(c.x,BONE_TOP+.05+u*1.2,c.z);c.c.scale.setScalar(Math.max(.001,crumbRate*(u<.85?1:(1-u)*6.6)))});

  // FPPS
  fpps.rotation.y=time*.25;
  fppsMat.color.copy(FPPS_COL).lerp(FPPS_OFF,S.block);
  siteGlow.material.opacity=.95*(1-S.block)*(.5+.5*Math.sin(time*3));
  halo.material.opacity=.9*S.block;halo.visible=S.block>.01;halo.rotation.set(1.0+.2*Math.sin(time*.7),time*.4,0);halo.scale.setScalar(1+.04*Math.sin(time*3));

  // flussi
  ups.forEach((m,i)=>{
    const t=(i/ups.length+time*.11)%1;
    if(t<.8)m.position.copy(curveA.getPointAt(t/.8));else m.position.lerpVectors(P_I,FP,(t-.8)/.2);
    let s=1;if(t>.8)s=1-S.block;if(t<.04)s=t/.04;if(t>.96)s=Math.min(s,(1-t)/.04);
    m.scale.setScalar(Math.max(.001,s));
  });
  downs.forEach((m,i)=>{const t=(i/downs.length+time*.13)%1;m.position.copy(curveB.getPointAt(t));const s=(1-S.block)*Math.min(1,t/.06,(1-t)/.06);m.scale.setScalar(Math.max(.001,s))});
  ippCl.forEach((o,i)=>{const v=clamp01(S.ipp*ippCl.length-i);o.m.position.copy(P_I).add(o.o).add(V(Math.sin(time*1.3+o.ph)*.05,Math.cos(time*1.1+o.ph)*.05,0));o.m.scale.setScalar(Math.max(.001,v*.09))});
  ippNode.scale.setScalar(1+.6*S.ipp);
  spills.forEach((m,i)=>{const t=(i/spills.length+time*.12)%1;m.position.copy(curveC.getPointAt(t));m.scale.setScalar(Math.max(.001,S.spill*.085*Math.min(1,t/.05,(1-t)/.05)))});

  // farmaco
  const mv=S.mol;
  if(mv<1)mol.position.lerpVectors(M_HID,M_HOV,mv);else mol.position.lerpVectors(M_HOV,SITE,mv-1);
  mol.rotation.y+=dt*(1.4-1.2*clamp01(mv-1));mol.rotation.x=Math.sin(time*.6)*.3*(2-mv)/2;
  fade(mol,Math.min(1,mv));mol.scale.setScalar(1.1-.25*Math.max(0,mv-1));

  // linfocita
  const act=S.tact,pulse=.5+.5*Math.sin(time*3.2);
  tcMat.uniforms.uCol.value.copy(TC_COL).lerp(TC_HOT,act*pulse*.8);
  tc.scale.setScalar(1+.06*act*Math.sin(time*3.2));
  tcrMat.color.setRGB(.31+.6*act*pulse,.55+.2*act*pulse,1);
  warmL.intensity=1.0*act+1.2*S.fever*(1-.6*S.ster);
  const ckLevel=S.cyto*(1-.72*S.ster);
  cks.forEach((c,i)=>{const u=(c.ph+time*.16)%1;const r=1.55+u*3.6;c.m.position.copy(TC).addScaledVector(c.d,r);c.m.position.x+=Math.sin(time*1.5+c.ph*20)*.08*u;const vis=i/cks.length<ckLevel?1:0;c.m.scale.setScalar(Math.max(.001,vis*.08*(u<.82?Math.min(1,u*8):(1-u)/.18)))});
  dex.position.lerpVectors(D_HID,D_ON,S.ster);dex.rotation.y=time*.5;dex.rotation.z=Math.sin(time*.7)*.2;fade(dex,S.ster);
  steroHalo.material.opacity=.7*S.ster;steroHalo.visible=S.ster>.01;steroHalo.rotation.set(Math.PI/2+.3*Math.sin(time*.5),time*.3,0);
  $("heat").style.opacity=(S.fever*(1-.6*S.ster)).toFixed(3);

  renderer.render(scene,camera);

  const on=STEPS[step].labels;
  for(const key in LBL){
    const L=LBL[key],el=L.el,vis=on.includes(key);
    el.classList.toggle("on",vis);
    const p=L.p().project(camera);
    if(p.z>1){el.style.transform="translate(-9999px,0)";continue}
    const x=(p.x*.5+.5)*W,y=(-p.y*.5+.5)*H;
    el.style.transform="translate("+x.toFixed(1)+"px,"+y.toFixed(1)+"px) translate(-50%,-100%)";
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>

</body>

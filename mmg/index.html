<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Osteo Help MMG</title>
<meta name="description" content="Gestione del paziente con osteoporosi per il medico di medicina generale: forme secondarie, DeFRA, Nota 79, follow-up.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../apple-touch-icon-180.png">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Osteo MMG">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Stile ripreso da Osteo Help (copia: Osteo Help non viene toccato). Layout: una schermata per volta (home → inserimento → risultato → scheda), colonna stretta centrata; blocchi piatti con barra d'accento a sinistra */
:root{
  --home-p:#D3CCEF;
  --bg:#FFFFFF; --ink:#1B2433; --muted:#6F7988; --faint:#B5BECA; --line:#E1E5EB;
  --box:#F2F4F7; --blue:#6A5C92; --blue-box:#F1EEFB; --teal:#0E7571; --teal-box:#E3F4F3; --focus:#2F5F96; --tile:#FFFFFF;
  --home-a:#F7C6B7; --home-n:#B0DFCC; --home-sub:#333C49;
  --coral:#B04E37; --coral-box:#F7EBE7; --amber:#9A6B1F;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}

/* barra superiore */
.bar{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(8px + env(safe-area-inset-top)) 16px 8px}
.bar-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:72px 1fr 72px;align-items:center;height:44px}
.bar-t{text-align:center;font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar button{border:0;background:none;padding:4px 0;color:var(--muted);font-size:.85rem;font-weight:500}
.bar #back{display:flex;align-items:center;justify-self:start}
.bar #back svg{width:22px;height:22px}
.bar #act{justify-self:end}
.bar #act:hover,.bar #back:hover{color:var(--ink)}
.bar #act{grid-column:3;grid-row:1}
.bar.home .bar-in{grid-template-columns:1fr auto;column-gap:8px}
.bar.home #back{display:none}
/* in home: marchio OH e nome a sinistra, come in Osteoclick */
.bar.home .bar-t{grid-column:1;display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;letter-spacing:-.01em}
.bar #help{grid-column:2;grid-row:1}
/* tondo «i»: cerchio piccolo (30px) dentro un pulsante che resta di 42px, così l'area da toccare non cambia */
.bar #help{position:relative;width:42px;height:42px;border:0;background:none;display:grid;place-items:center;padding:0;color:var(--ink);line-height:1}
.bar #help::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--box)}
.bar #help svg{position:relative;width:17px;height:17px}
.oh{width:32px;height:32px;border-radius:9px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:13px;font-weight:800;letter-spacing:-.02em;flex:0 0 auto}

main{max-width:560px;margin:0 auto;padding:4px 16px 120px}
.screen{display:flex;flex-direction:column;gap:14px}
h1{font-size:1.85rem;line-height:1.05;font-weight:800;letter-spacing:-.025em;margin:6px 0 0;text-wrap:balance;overflow-wrap:anywhere;hyphens:auto}
.rule{height:1px;background:var(--line);margin:2px 0 4px}
.sub{color:var(--muted);font-size:.92rem;line-height:1.45;margin:-4px 0 0}
.lbl{font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 -6px}
.hint{color:var(--muted);font-size:.9rem;margin:0}
.foot{font-size:.74rem;color:var(--muted);line-height:1.5;text-align:center;margin:28px 0 0}

/* ingressi */
.entry{position:relative;display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;background:var(--box);border-radius:10px;padding:16px 14px 16px 19px}
.entry::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:2px;background:var(--faint)}
.entry.blue{background:var(--blue-box)} .entry.blue::before{background:var(--blue)}
.entry.teal{background:var(--teal-box)} .entry.teal::before{background:var(--teal)}
.entry.plain{padding-left:16px} .entry.plain::before{content:none}
.rows.ind .rowlink{padding-left:14px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--coral);flex:0 0 auto;vertical-align:middle;position:relative;top:-1px}
.dot.no{visibility:hidden}
.cat .rowlink{position:relative} .cat .rowlink > .dot{position:absolute;left:1px;top:21px}
.cat-key{margin:-4px 0 0}
.cat-top{display:flex;flex-direction:column;gap:14px}
.seg + .lbl{margin-top:18px}
.cat-key .dot{margin:0 6px 0 0}
.entry > div{flex:1;min-width:0}
.entry b{display:block;font-size:1.05rem;letter-spacing:-.01em;line-height:1.3}
.entry.blue b{color:var(--blue)} .entry.teal b{color:var(--teal)}
.entry small{display:block;color:var(--muted);font-size:.83rem;margin-top:3px;line-height:1.4}
.entry.big{min-height:92px;padding:14px 16px 14px 14px;border-radius:22px;transition:transform .12s} .entry.big:active{transform:scale(.98)} .entry.big::before{content:none}
.stack.home{display:grid;grid-auto-rows:1fr;gap:12px}
/* home: stesse misure della home di Osteoclick (titolo più in basso, più aria sopra i riquadri, righe di Consulta più compatte) */
body.is-home main h1{margin-top:18px}
/* come la home di Osteoclick: lineetta blu sotto il titolo, freccia dei riquadri nel cerchietto bianco, icone di Consulta nel riquadrino grigio */
body.is-home main .rule{width:36px;height:3px;border-radius:2px;background:#2B587D}
body.is-home .entry.big .chev{width:28px;height:28px;padding:7px;margin:0 -7px 0 -6px;box-sizing:border-box;border-radius:50%;background:rgba(255,255,255,.65);color:var(--ink);stroke-width:2.2}
body.is-home main .sub{margin-top:-2px}
body.is-home .stack.home{margin-top:6px}
body.is-home .rows .rowlink{padding:9px 0}
body.is-home .rows .rowlink > .ic{width:40px;height:40px;padding:9px;border-radius:12px;background:var(--box);color:var(--home-sub);margin-right:2px}
.entry.big b{font-size:1.12rem;color:var(--ink)}
.chev{width:16px;height:16px;color:var(--faint);flex:0 0 auto}
.ic{width:26px;height:26px;flex:0 0 auto}
.entry > .ic{color:var(--muted)}
.entry.blue > .ic{color:var(--blue)} .entry.teal > .ic{color:var(--teal)}
.entry.big > .ic{width:54px;height:54px;padding:13px;border-radius:14px;background:var(--tile)}
.entry.big.blue{background:var(--home-a)} .entry.big.teal{background:var(--home-n)} .entry.big small{color:var(--home-sub)}
.entry.big.blue > .ic,.entry.big.teal > .ic{color:#172231}
.rowlink > .ic{width:24px;height:24px;color:var(--muted)}
.rowlink > span{flex:1}
.katrow{margin:10px 0 -11px}
.kat{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:6px;background:var(--kb);color:var(--kf)}
.k-violet{--kb:#EEE9F8;--kf:#5B45A0} .k-amber{--kb:#F8EEDC;--kf:#875812} .k-red{--kb:#F8E6E6;--kf:#A33A3A} .k-pink{--kb:#F8E7EF;--kf:#963C66}
.k-blue{--kb:#E4EDF8;--kf:#2F5F96} .k-green{--kb:#E6F1E4;--kf:#3D6E35} .k-orange{--kb:#FBEBDF;--kf:#9E511B} .k-cyan{--kb:#E1F2F4;--kf:#1E6A73}
.k-indigo{--kb:#E8EAF8;--kf:#3F4A9E} .k-slate{--kb:#ECEEF1;--kf:#4F5B6B} .k-brown{--kb:#F2EBE3;--kf:#6E5135}
.stack{display:flex;flex-direction:column;gap:8px}
/* TELEFONO IN ORIZZONTALE (poca altezza, come EO Pocket): la home in due colonne,
   a sinistra titolo e riquadri fermi, a destra Consulta e il resto, che scorrono */
.home-l,.home-r{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (orientation:landscape) and (max-height:559px) and (min-width:560px){
  body.is-home main{max-width:960px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  body.is-home .bar{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
  body.is-home .bar-in{max-width:928px}
  body.is-home main > .screen{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:28px;align-items:start}
  body.is-home .home-l{position:sticky;top:calc(60px + env(safe-area-inset-top));gap:10px}
  body.is-home .home-l h1{margin-top:2px;font-size:26px}
  body.is-home .home-l .entry.big{min-height:64px;padding-top:9px;padding-bottom:9px;border-radius:18px}
  body.is-home .home-l .entry.big > .ic{width:44px;height:44px;padding:10px;border-radius:12px}
  body.is-home .home-l :is(.stack.home,.heroes){gap:8px;margin-top:2px}
  body.is-home .home-r > .lbl:first-child{margin-top:4px}
  body.is-home .screen > .foot{grid-column:2;margin-top:12px}
}

/* righe semplici */
.rows{display:flex;flex-direction:column}
.rowlink{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:13px 2px;font-weight:600;font-size:.95rem}
.rowlink:last-child{border-bottom:0}
.rowlink small{display:block;font-weight:400;color:var(--muted);font-size:.8rem;margin-top:1px}
.rowlink > span{min-width:0}

/* griglia ▲ N ▼ */
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row > span{font-weight:600;font-size:.95rem;min-width:0}
.tri{display:flex;gap:4px;flex:0 0 auto}
.tri button{border:1px solid var(--line);background:transparent;color:var(--muted);min-width:38px;height:32px;border-radius:7px;font-weight:600;font-size:.8rem;padding:0 8px}
.tri button.n{min-width:30px;font-size:.72rem;color:var(--faint)}
.tri button[aria-pressed="true"].u{background:var(--blue-box);border-color:var(--blue);color:var(--blue)}
.tri button[aria-pressed="true"].d{background:var(--coral-box);border-color:var(--coral);color:var(--coral)}
.tri button[aria-pressed="true"].n{background:var(--box);border-color:var(--muted);color:var(--ink)}

/* tag */
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.78rem;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--box);color:var(--muted);white-space:nowrap}
.tag.u{background:var(--blue-box);color:var(--blue)}
.tag.d{background:var(--coral-box);color:var(--coral)}
.tag.off{opacity:.4}
.ptags{margin:6px 0 2px;font-weight:600}

/* elenchi */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:12px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);font-size:.93rem}
.list li:last-child{border-bottom:0}
.list li i{font-style:normal;font-weight:700;color:var(--blue);font-size:.78rem;width:16px;flex:0 0 auto;font-variant-numeric:tabular-nums}
.list li em{font-style:normal;margin-left:auto;color:var(--teal);font-size:.74rem;font-weight:600;white-space:nowrap;padding-left:8px}
.list li em.lieve{color:var(--muted);font-weight:500}
.list.mute li{color:var(--muted)}
.list.mute li em{color:var(--muted);font-weight:500}
.list li.forte{font-weight:600}
.list li .mk{width:16px;flex:0 0 auto;color:var(--teal);font-weight:800;font-size:.85rem}
.note{font-size:.93rem;line-height:1.65;margin:0;text-align:justify;hyphens:auto;-webkit-hyphens:auto}
.badge{font-weight:700;letter-spacing:.02em}
.badge.forte{color:var(--teal)} .badge.lieve{color:var(--amber)}

/* accordion */
details.acc{border-bottom:1px solid var(--line)}
details.acc > summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px 2px;cursor:pointer;font-weight:700}
details.acc > summary::-webkit-details-marker{display:none}
details.acc > summary > span:first-child{flex:1;min-width:0}
details.acc > summary small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
details.acc[open] > summary .chev{transform:rotate(90deg)}
.accbody{padding:0 2px 14px;display:flex;flex-direction:column;gap:6px}
.n{font-size:.75rem;font-weight:700;color:var(--teal);background:var(--teal-box);padding:2px 8px;border-radius:20px}
.ck{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;border:0;background:none;padding:9px 0;border-bottom:1px solid var(--line);font-size:.93rem;line-height:1.4}
.ck:last-child{border-bottom:0}
.ck .cb{width:18px;height:18px;border:1.5px solid var(--faint);border-radius:5px;flex:0 0 auto;display:grid;place-items:center;margin-top:1px}
.ck .cb svg{width:12px;height:12px;color:var(--bg);display:none}
.ck[aria-pressed="true"]{font-weight:600}
.ck[aria-pressed="true"] .cb{background:var(--teal);border-color:var(--teal)}
.ck[aria-pressed="true"] .cb svg{display:block}
.altb{position:relative;margin-top:22px;padding:13px 14px 13px 17px;border-radius:10px;background:var(--box)}
.altb::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:2px}
.altb.u{background:var(--blue-box)} .altb.u::before{background:var(--blue)} .altb.u b{color:var(--blue)}
.altb.d{background:var(--coral-box)} .altb.d::before{background:var(--coral)} .altb.d b{color:var(--coral)}
.altb b{display:block;font-size:1rem} .altb small{display:block;color:var(--muted);font-size:.86rem;margin-top:2px;line-height:1.45}
.rowlink[hidden]{display:none}
.l2{font-size:.66rem;font-weight:700;letter-spacing:.06em;color:var(--blue);text-transform:uppercase;margin-left:6px}

/* controlli */
.seg{display:inline-flex;background:var(--box);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 16px;border-radius:7px;font-weight:600;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.ctl{display:flex;align-items:center;gap:10px}
.ctl small{font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.search{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:10px 12px;font-size:16px}
.search::placeholder{color:var(--muted)}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.calc label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:600;color:var(--muted)}
.calc input,.calc select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;font-size:16px;width:100%;min-width:0}
.calc .pair{display:flex;gap:6px}
.calc .pair select{width:auto;flex:0 0 auto}
.out{font-size:.95rem;margin:0}
.out b{font-size:1.15rem;font-variant-numeric:tabular-nums}
.small{font-size:.8rem;color:var(--muted);line-height:1.55;margin:0}
.refsbody{font-size:.84rem;line-height:1.55;color:var(--muted)}
.refsbody ol{padding-left:0;margin:6px 0;list-style:none}
.refsbody li{position:relative;padding:10px 0 10px 30px;border-bottom:1px solid var(--line);text-align:justify;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word}
.refsbody li:last-child{border-bottom:0}
.refsbody li::before{content:attr(data-n) ".";position:absolute;left:0;width:22px;text-align:right;font-variant-numeric:tabular-nums}
.refsbody i{color:var(--ink);font-style:normal;font-weight:500}
.refsbody.src li::before{content:none}
.refsbody .rn{position:absolute;left:0;width:22px;text-align:right;font-variant-numeric:tabular-nums;color:var(--focus);font-weight:600;text-decoration:none}
.small a[data-ref]{color:var(--focus);font-weight:600;text-decoration:none}
.refsbody li.hl{animation:hl 2.4s ease-out}
@keyframes hl{0%,40%{background:var(--blue-box);box-shadow:inset 3px 0 0 var(--blue)}}
.refsbody .refs-sub{font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin:18px 0 0}
.refsbody .refs-sub:first-child{margin-top:4px}
.refsbody .refs-foot{margin:14px 0 0}

/* barra azione in basso */
/* PC (da 1000px): due colonne. A sinistra l'elenco o l'inserimento, a destra la scheda
   o il risultato; ognuna scorre per conto suo */
.pane-empty{display:grid;place-items:center;align-content:center;gap:10px;min-height:60vh;color:var(--muted);text-align:center;font-size:.95rem}
.pane-empty .ic{width:44px;height:44px;color:var(--faint)}
@media (min-width:1000px){
  .bar-in{max-width:1240px}
  body.split main{max-width:1240px;padding:0 24px;display:grid;grid-template-columns:minmax(380px,440px) minmax(0,1fr);align-items:start}
  body.split .pane{position:sticky;top:calc(60px + env(safe-area-inset-top));height:calc(100vh - 60px - env(safe-area-inset-top));overflow-y:auto;overscroll-behavior:contain;padding:4px 0 48px}
  body.split .pane-l{padding-right:28px;scrollbar-width:thin}
  body.split .pane-r{border-left:1px solid var(--line);padding-left:40px;padding-right:8px}
  body.split .pane-r > .screen{max-width:680px}
  /* voce aperta: fondo grigio disegnato dietro la riga, che resta ferma (testo e pallino al loro posto);
     la colonna ha 12px di margine a sinistra perché il fondo non venga tagliato */
  body.split .pane-l{padding-left:12px;margin-left:-12px}
  body.split .pane-l .rowlink.sel{position:relative;z-index:0}
  body.split .pane-l .rowlink.sel::after{content:"";position:absolute;inset:0 -10px;z-index:-1;background:var(--box);border-radius:8px}
  body.split .pane-l .entry.sel{outline:2px solid var(--ink);outline-offset:-2px}
  body.split .dock{display:none}
  /* catalogo ed esame per esame: titolo e ricerca restano fermi in alto, scorre solo l'elenco */
  body.split .pane-l .cat-top{position:sticky;top:-4px;z-index:2;background:var(--bg);margin-top:-4px;padding:4px 0 12px;box-shadow:-12px 0 0 var(--bg),12px 0 0 var(--bg),0 1px 0 var(--line)}
  /* home: come col telefono in orizzontale, titolo e riquadri a sinistra, Consulta a destra */
  /* il contenuto della home al centro dell'altezza (un po' più su, per l'occhio): meno bianco in fondo */
  body.is-home main{max-width:1040px;padding-left:24px;padding-right:24px;min-height:calc(100vh - 60px - env(safe-area-inset-top));display:grid;align-content:center;padding-top:0;padding-bottom:16vh}
  body.is-home .bar-in{max-width:992px}
  body.is-home main > .screen{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:48px;align-items:start;padding-top:12px}
  /* il titolo sta sopra, da solo: il sottotitolo e i riquadri a sinistra partono alla stessa altezza di Consulta.
     La colonna di sinistra si scompone nella griglia; l'ultima riga elastica assorbe l'altezza in più di Consulta */
  body.is-home main > .screen{grid-template-rows:auto auto auto auto 1fr auto;row-gap:14px}
  /* la riga in fondo, al centro della pagina sotto le due colonne */
  body.is-home .screen > .foot{grid-column:1 / -1;grid-row:6;margin-top:40px}
  /* titolo su una riga sola, più grande, sopra le due colonne */
  body.is-home .home-l > h1{grid-column:1 / -1;font-size:42px!important;line-height:1.08;margin-top:0}
  body.is-home main h1 br{display:none}
  /* i riquadri si allungano fino al fondo di Consulta: le due colonne finiscono alla stessa altezza */
  body.is-home .screen > .home-l > .stack.home{grid-row:4 / 6;align-self:stretch}
  body.is-home .screen > .home-l > .stack.home > *{min-height:0}
  /* testi un po' più grandi che sul telefono; la riga in fondo più scura */
  body.is-home main .lbl{font-size:12px}
  body.is-home main .foot{font-size:13px;color:#4F5967}
